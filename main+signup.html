<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarBase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2a3a80;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        header {
            background: #4559b1;
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            font-weight: 700;
        }

        .tab-buttons {
            display: flex;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: #f5f5f5;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 500;
            transition: all 0.3s ease;
            color: #333;
        }

        .tab-btn:hover {
            background: #e8e8e8;
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
            margin-bottom: -2px;
        }

        .tab-content {
            padding: 40px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-section h2 {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="number"]:focus,
        input[type="file"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        button[type="submit"] {
            background: #667eea;
            color: white;
            padding: 12px 40px;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            width: 100%;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .price-range {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .link {
            color: #667eea;
            text-decoration: none;
        }

        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 CarBase</h1>
        </header>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('reader')">
                👤 Customer
            </button>
            <button class="tab-btn" onclick="switchTab('dealership')">
                🏢 Dealership
            </button>
        </div>

        <!-- CUSTOMER/READER TAB -->
        <div id="reader" class="tab-content active">
            <div class="form-section">
                <h2>Find Your Perfect Car</h2>
                <form>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="car-make">Car Make *</label>
                            <input type="text" id="car-make" placeholder="e.g., Toyota, Honda, BMW" required>
                        </div>
                        <div class="form-group">
                            <label for="car-model">Car Model *</label>
                            <input type="text" id="car-model" placeholder="e.g., Civic, Accord, Camry" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="min-price">Minimum Price ($)</label>
                            <input type="number" id="min-price" placeholder="0" min="0">
                        </div>
                        <div class="form-group">
                            <label for="max-price">Maximum Price ($)</label>
                            <input type="number" id="max-price" placeholder="999999" min="0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="condition">Condition</label>
                        <select id="condition">
                            <option value="">-- Select --</option>
                            <option value="new">New</option>
                            <option value="used">Used</option>
                            <option value="both">Both</option>
                        </select>
                    </div>

                    <button type="submit">Search Vehicles</button>
                </form>
            </div>

            <div class="form-section">
                <h2>Create an Account</h2>
                <p style="margin-bottom: 20px; color: #666;">Save your favorite vehicles and track listings!</p>
                <form>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cust-first-name">First Name *</label>
                            <input type="text" id="cust-first-name" placeholder="John" required>
                        </div>
                        <div class="form-group">
                            <label for="cust-last-name">Last Name *</label>
                            <input type="text" id="cust-last-name" placeholder="Doe" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="cust-email">Email Address *</label>
                        <input type="email" id="cust-email" placeholder="john.doe@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="cust-phone">Phone Number</label>
                        <input type="tel" id="cust-phone" placeholder="(123) 456-7890">
                    </div>

                    <button type="submit">Sign Up</button>
                </form>
            </div>
        </div>

        <!-- DEALERSHIP TAB -->
        <div id="dealership" class="tab-content">
            <div class="form-section">
                <h2>Upload Your Vehicles</h2>
                <form>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="vehicle-make">Car Make *</label>
                            <input type="text" id="vehicle-make" placeholder="e.g., Toyota" required>
                        </div>
                        <div class="form-group">
                            <label for="vehicle-model">Car Model *</label>
                            <input type="text" id="vehicle-model" placeholder="e.g., Civic" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="vehicle-year">Year *</label>
                            <input type="number" id="vehicle-year" placeholder="2023" min="1900" max="2099" required>
                        </div>
                        <div class="form-group">
                            <label for="vehicle-condition">Condition *</label>
                            <select id="vehicle-condition" required>
                                <option value="">-- Select --</option>
                                <option value="new">New</option>
                                <option value="used">Used</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="vehicle-price">Price ($) *</label>
                            <input type="number" id="vehicle-price" placeholder="25000" min="0" required>
                        </div>
                        <div class="form-group">
                            <label for="vehicle-mileage">Mileage (miles)</label>
                            <input type="number" id="vehicle-mileage" placeholder="45000" min="0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="vehicle-description">Vehicle Description</label>
                        <textarea id="vehicle-description" placeholder="Describe the condition, features, and any notable details about this vehicle..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="vehicle-image">Upload Vehicle Image</label>
                        <input type="file" id="vehicle-image" accept="image/*">
                    </div>

                    <button type="submit">Add Vehicle to Listing</button>
                </form>
            </div>

            <div class="form-section">
                <h2>Dealership Information</h2>
                <form>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="dealer-name">Dealership Name *</label>
                            <input type="text" id="dealer-name" placeholder="Your Dealership Name" required>
                        </div>
                        <div class="form-group">
                            <label for="dealer-type">Seller Type *</label>
                            <select id="dealer-type" required>
                                <option value="">-- Select --</option>
                                <option value="dealership">Dealership</option>
                                <option value="private-seller">Private Seller</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="dealer-email">Email Address *</label>
                        <input type="email" id="dealer-email" placeholder="contact@dealership.com" required>
                    </div>

                    <div class="form-group">
                        <label for="dealer-phone">Phone Number *</label>
                        <input type="tel" id="dealer-phone" placeholder="(123) 456-7890" required>
                    </div>

                    <div class="form-group">
                        <label for="dealer-address">Street Address *</label>
                        <input type="text" id="dealer-address" placeholder="123 Main Street" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="dealer-city">City *</label>
                            <input type="text" id="dealer-city" placeholder="Dallas" required>
                        </div>
                        <div class="form-group">
                            <label for="dealer-state">State *</label>
                            <input type="text" id="dealer-state" placeholder="TX" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="dealer-zip">Zip Code *</label>
                            <input type="text" id="dealer-zip" placeholder="75001" required>
                        </div>
                        <div class="form-group">
                            <label for="dealer-website">Website</label>
                            <input type="text" id="dealer-website" placeholder="https://yourdealership.com">
                        </div>
                    </div>

                    <button type="submit">Update Dealership Profile</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            // Hide all tab contents
            const allTabs = document.querySelectorAll('.tab-content');
            allTabs.forEach(tab => tab.classList.remove('active'));

            // Remove active class from all buttons
            const allButtons = document.querySelectorAll('.tab-btn');
            allButtons.forEach(btn => btn.classList.remove('active'));

            // Show selected tab
            document.getElementById(tabName).classList.add('active');

            // Highlight active button
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
